<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --border: #e2e4e9;
  --border-light: #eef0f3;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --blue-mid: #bfdbfe;
  --green: #16a34a;
  --green-light: #f0fdf4;
  --green-mid: #bbf7d0;
  --red: #dc2626;
  --red-light: #fef2f2;
  --red-mid: #fecaca;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --amber-mid: #fde68a;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --purple-mid: #ddd6fe;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
input, select, textarea { font-family: inherit; font-size: 13px; }

/* Layout */
#app { min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 32px; height: 32px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.brand-icon svg { display: block; }
.brand-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.user-info { text-align: right; }
.user-info .name { font-size: 13px; font-weight: 500; }
.user-info .sub { font-size: 11px; color: var(--text-secondary); }
.notif-btn { position: relative; width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.notif-btn:hover { background: var(--bg); }
.notif-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; border: 1.5px solid var(--surface); }

.layout { display: flex; height: calc(100vh - 56px); }
.sidenav { width: 200px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
.nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; padding: 0 16px 6px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-left: 2.5px solid transparent; transition: all .12s; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { color: var(--blue); border-left-color: var(--blue); background: var(--blue-light); font-weight: 500; }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .65; }
.nav-item.active .nav-icon { opacity: 1; }
.main { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; color: var(--text); }
.card-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .12s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #1d4ed8; }
.btn-danger { background: var(--red-light); color: var(--red); border-color: var(--red-mid); }
.btn-danger:hover { background: var(--red-mid); }
.btn-success { background: var(--green-light); color: var(--green); border-color: var(--green-mid); }
.btn-success:hover { background: var(--green-mid); }
.btn-warning { background: var(--amber-light); color: var(--amber); border-color: var(--amber-mid); }
.btn-warning:hover { background: var(--amber-mid); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-full { width: 100%; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.badge-admin { background: var(--purple-light); color: var(--purple); }
.badge-employee { background: var(--green-light); color: var(--green); }
.badge-intern { background: var(--blue-light); color: var(--blue); }
.badge-in { background: var(--green-light); color: var(--green); }
.badge-lunch { background: var(--amber-light); color: var(--amber); }
.badge-out { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
.badge-absent { background: var(--red-light); color: var(--red); }
.badge-late { background: var(--amber-light); color: var(--amber); }
.badge-overtime { background: var(--purple-light); color: var(--purple); }
.badge-pending { background: var(--amber-light); color: var(--amber); }
.badge-approved { background: var(--green-light); color: var(--green); }
.badge-rejected { background: var(--red-light); color: var(--red); }

/* Stats grid */
.stats-grid { display: grid; gap: 12px; margin-bottom: 16px; }
.stats-grid-4 { grid-template-columns: repeat(4,1fr); }
.stats-grid-3 { grid-template-columns: repeat(3,1fr); }
.stats-grid-2 { grid-template-columns: repeat(2,1fr); }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.stat-num { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Table */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.tbl td { padding: 10px 10px; border-bottom: 1px solid var(--border-light); color: var(--text); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--bg); }
.tbl-person { display: flex; align-items: center; gap: 8px; }

/* Avatar */
.avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; flex-shrink: 0; font-size: 11px; overflow: hidden; }
.av-lg { width: 52px; height: 52px; font-size: 18px; }
.av-md { width: 36px; height: 36px; font-size: 13px; }
.av-sm { width: 28px; height: 28px; font-size: 10px; }
.av-xs { width: 22px; height: 22px; font-size: 9px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Forms */
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }
.form-input { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; transition: border-color .12s; }
.form-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.filter-bar .form-group { margin: 0; }
.filter-bar .form-input { min-width: 120px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
.modal { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 22px 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-footer { display: flex; gap: 8px; margin-top: 18px; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9999; white-space: nowrap; box-shadow: var(--shadow-md); }
.toast.show { opacity: 1; }

/* Notifications panel */
.notif-panel { position: absolute; top: 50px; right: 0; width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); z-index: 200; overflow: hidden; }
.notif-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.notif-item { padding: 12px 16px; border-bottom: 1px solid var(--border-light); }
.notif-item:last-child { border-bottom: none; }
.notif-item-title { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.notif-item-sub { font-size: 11px; color: var(--text-secondary); }
.notif-empty { padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 12px; }

/* Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-day-hdr { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-muted); padding: 4px; text-transform: uppercase; letter-spacing: .05em; }
.cal-cell { aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .1s; }
.cal-cell:hover { border-color: var(--border); background: var(--bg); }
.cal-cell.other-month { color: var(--text-muted); }
.cal-cell.today { border-color: var(--blue); }
.cal-cell.has-in { background: var(--green-light); color: var(--green); }
.cal-cell.has-late { background: var(--amber-light); color: var(--amber); }
.cal-cell.has-absent { background: var(--red-light); color: var(--red); }
.cal-cell.empty { background: transparent; cursor: default; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 2px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-nav-title { font-size: 14px; font-weight: 600; }

/* Hpill */
.hpill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.hpill-done { background: var(--green-light); color: var(--green); }
.hpill-active { background: var(--amber-light); color: var(--amber); }
.hpill-late { background: var(--red-light); color: var(--red); }
.hpill-ot { background: var(--purple-light); color: var(--purple); }

/* QR Box */
.qr-box { width: 140px; height: 140px; margin: 0 auto 16px; border: 2px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all .15s; }
.qr-box:hover, .qr-box.scanning { border-color: var(--blue); border-style: solid; background: var(--blue-light); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
.qr-box.scanning { animation: pulse 1s infinite; }

/* Leave request card */
.leave-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px; }
.leave-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.leave-card-name { font-size: 13px; font-weight: 500; }
.leave-card-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
.leave-card-reason { font-size: 12px; color: var(--text); background: var(--bg); padding: 8px 10px; border-radius: var(--radius-sm); }

/* Password strength */
.pw-strength { height: 3px; border-radius: 99px; background: var(--border); margin-top: 4px; overflow: hidden; }
.pw-strength-bar { height: 100%; border-radius: 99px; transition: width .3s, background .3s; }

/* Profile photo area */
.photo-upload { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; flex-shrink: 0; }
.photo-upload:hover { border-color: var(--blue); }
.photo-upload img { width: 100%; height: 100%; object-fit: cover; }
.photo-upload-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; border-radius: 50%; }
.photo-upload:hover .photo-upload-overlay { opacity: 1; }

/* Dept bar chart */
.dept-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dept-bar-label { font-size: 12px; color: var(--text-secondary); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dept-bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.dept-bar-fill { height: 100%; border-radius: 99px; background: var(--blue); }
.dept-bar-val { font-size: 12px; font-weight: 500; color: var(--text); width: 40px; text-align: right; flex-shrink: 0; }

/* Shift settings */
.shift-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.shift-row label { font-size: 12px; font-weight: 500; min-width: 70px; }

/* Schedule planner */
.sched-week { display: grid; grid-template-columns: repeat(7,minmax(120px,1fr)); gap: 6px; margin-bottom: 16px; min-width: 0; }
.sched-week-wrap { overflow-x: auto; margin-bottom: 16px; }
.sched-week-wrap .sched-week { margin-bottom: 0; }
.sched-day-col { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.sched-day-hdr { background: var(--bg); padding: 7px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); text-align: center; border-bottom: 1px solid var(--border); }
.sched-day-hdr.today-hdr { background: var(--blue-light); color: var(--blue); }
.sched-day-body { padding: 6px; min-height: 80px; }
.sched-entry { background: var(--blue-light); border: 1px solid var(--blue-mid); border-radius: 4px; padding: 4px 6px; margin-bottom: 4px; font-size: 10px; color: var(--blue); cursor: pointer; }
.sched-entry:hover { background: var(--blue-mid); }
.sched-entry.type-shift { background: var(--green-light); border-color: var(--green-mid); color: var(--green); }
.sched-entry.type-meeting { background: var(--purple-light); border-color: var(--purple-mid); color: var(--purple); }
.sched-entry.type-event { background: var(--amber-light); border-color: var(--amber-mid); color: var(--amber); }
.sched-entry.type-offday { background: var(--red-light); border-color: var(--red-mid); color: var(--red); }
.sched-entry-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-entry-time { opacity: .75; margin-top: 1px; }
.sched-add-btn { width: 100%; background: none; border: 1px dashed var(--border); border-radius: 4px; padding: 5px; font-size: 11px; color: var(--text-muted); cursor: pointer; margin-top: 2px; }
.sched-add-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.sched-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; margin-top: 6px; }
.sched-legend-item { display: flex; align-items: center; gap: 5px; }
.sched-legend-dot { width: 10px; height: 10px; border-radius: 2px; }
.sched-member-view { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; }
.sched-member-date { min-width: 44px; text-align: center; font-size: 11px; color: var(--text-secondary); }
.sched-member-day { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1; }
.sched-member-entries { flex: 1; }
.cal-cell.has-sched { outline: 2px solid var(--purple); outline-offset: -2px; }
.sched-week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sched-week-nav-title { font-size: 14px; font-weight: 600; }

/* Multi-person chip picker */
.chip-picker { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 5px; background: var(--surface); cursor: text; min-height: 38px; }
.chip-picker:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; cursor: pointer; user-select: none; transition: all .1s; }
.chip-all { background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-mid); }
.chip-person { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.chip-person.selected { background: var(--green-light); color: var(--green); border-color: var(--green-mid); }
.chip-person:hover { border-color: var(--blue); }
.chip-all.selected { background: var(--blue); color: #fff; border-color: var(--blue); }
.chip-remove { font-size: 10px; opacity: .6; margin-left: 2px; }
.chip-remove:hover { opacity: 1; }

/* Misc */
.sep { height: 1px; background: var(--border); margin: 16px 0; }
.text-sm { font-size: 12px; }
.text-muted { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }
.text-success { color: var(--green); }
.text-danger { color: var(--red); }
.text-mono { font-family: 'DM Mono', monospace; font-size: 12px; }
.flex { display: flex; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-1 { margin-bottom: 4px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%); padding: 20px; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; width: 100%; max-width: 380px; box-shadow: var(--shadow-md); }
.role-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
.role-opt { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; cursor: pointer; transition: all .12s; }
.role-opt:hover { border-color: var(--blue-mid); background: var(--blue-light); }
.role-opt.selected { border: 2px solid var(--blue); background: var(--blue-light); }
.role-opt-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 13px; font-weight: 600; color: #fff; }
.role-opt-label { font-size: 11px; font-weight: 500; color: var(--text); }
.demo-box { margin-top: 14px; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); font-size: 11px; color: var(--text-secondary); line-height: 1.8; }
.demo-box strong { color: var(--text); font-weight: 500; }

/* Mobile bottom nav */
.mobile-nav { display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); z-index:200; padding:4px 0 env(safe-area-inset-bottom,0); }
.mobile-nav-inner { display:flex; justify-content:space-around; }
.mobile-nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; cursor:pointer; color:var(--text-muted); min-width:0; flex:1; -webkit-tap-highlight-color:transparent; }
.mobile-nav-item.active { color:var(--blue); }
.mobile-nav-item svg { width:22px; height:22px; }
.mobile-nav-item span { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }

/* Swipeable nav drawer */
.nav-drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:299; opacity:0; transition:opacity .25s; }
.nav-drawer-overlay.open { display:block; opacity:1; }
.nav-drawer { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-radius:20px 20px 0 0; z-index:300; padding-bottom:env(safe-area-inset-bottom,0); transform:translateY(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); max-height:85vh; display:flex; flex-direction:column; }
.nav-drawer.open { transform:translateY(0); }
.nav-drawer-handle-wrap { padding:12px 0 4px; display:flex; justify-content:center; flex-shrink:0; cursor:grab; }
.nav-drawer-handle { width:40px; height:4px; background:var(--border); border-radius:99px; }

const ft = t => { if(!t) return '—'; const [h,m]=t.split(':'); const ap=+h>=12?'PM':'AM'; return ((+h%12)||12)+':'+m+' '+ap; };
const ch = (i,o,lo,li) => { if(!i||!o) return null; const [ih,im]=i.split(':').map(Number),[oh,om]=o.split(':').map(Number); let d=(oh*60+om)-(ih*60+im); if(lo&&li){const[loh,lom]=lo.split(':').map(Number),[lih,lim]=li.split(':').map(Number);const lb=(lih*60+lim)-(loh*60+lom);if(lb>0)d-=lb;} return d>0?d/60:null; };
const lunchDur = (lo,li) => { if(!lo||!li) return null; const [loh,lom]=lo.split(':').map(Number),[lih,lim]=li.split(':').map(Number); const m=(lih*60+lim)-(loh*60+lom); return m>0?m:null; };

async function hashPw(s) {
  const msgBuffer = new TextEncoder().encode(s + '_att_salt_2025');
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ─── Shift/late/overtime logic ─────────────────────────────────────────────

// Returns the scheduled start time (HH:MM) for a person on a given date,
// or falls back to the global shift start time.
function getScheduledStart(personId, date) {
  if (personId && date) {
    // Find a 'shift' type schedule entry assigned to this person on this date
    const entries = schedForDate(date, personId).filter(s => s.type === 'shift' && s.startTime);
    if (entries.length > 0) return entries[0].startTime;
  }
  return state.shifts.startTime;
}

// isLate now accepts optional (personId, date) to use the person's scheduled start.
// Falls back to global shift start when no personal schedule exists.
function isLate(inTime, personId, date) {
  if (!inTime) return false;
  const startTime = getScheduledStart(personId || null, date || null);
  const [sh, sm] = startTime.split(':').map(Number);
  const [ih, im] = inTime.split(':').map(Number);
  return (ih * 60 + im) > (sh * 60 + sm + 5); // 5 min grace
}

function isOvertime(hours) {
  return hours !== null && hours > state.shifts.maxHours;
}

function lateMinutes(inTime, personId, date) {
  if (!inTime) return 0;
  const startTime = getScheduledStart(personId || null, date || null);
  const [sh, sm] = startTime.split(':').map(Number);
  const [ih, im] = inTime.split(':').map(Number);
  return Math.max(0, (ih * 60 + im) - (sh * 60 + sm));
}

// ─── Notifications ─────────────────────────────────────────────────────────
// dismissed set: keys like 'forgot_out:personId', 'schedreqs', 'leaves', 'late'
// stored in state.dismissedNotifs (Set, not persisted — resets on page load)

function getNotifications() {
  const u = state.user;
  if (!u || u.role !== 'admin') return []; // notifications are admin-only
  const dismissed = state.dismissedNotifs || new Set();
  const notifs = [];

  // forgot to check out
  const forgotPeople = [];
  state.people.filter(p=>p.role!=='admin').forEach(p=>{
    const log = todayLog(p.id);
    if (log && log.in && !log.out) {
      const now = new Date();
      const nowM = now.getHours()*60+now.getMinutes();
      const [eh,em] = state.shifts.endTime.split(':').map(Number);
      if (nowM > eh*60+em+30 && !dismissed.has('forgot_out:'+p.id)) {
        forgotPeople.push({name:p.name, time:ft(log.in), personId:p.id});
      }
    }
  });
  if (forgotPeople.length) {
    notifs.push({type:'forgot_out', people:forgotPeople, count:forgotPeople.length, navPage:'logs'});
  }

  // pending schedule requests
  const pendingSchedReqs = state.scheduleRequests.filter(r=>r.status==='pending');
  if (pendingSchedReqs.length && !dismissed.has('schedreqs')) {
    notifs.push({type:'schedreqs', count:pendingSchedReqs.length, navPage:'schedrequests'});
  }

  // pending leaves
  const pendingLeaves = state.leaves.filter(l=>l.status==='pending');
  if (pendingLeaves.length && !dismissed.has('leaves')) {
    notifs.push({type:'leaves', count:pendingLeaves.length, navPage:'leaves'});
  }

  // late arrivals today
  const lateToday = state.people.filter(p=>p.role!=='admin').filter(p=>{
    const log = todayLog(p.id);
    return log && isLate(log.in, p.id, TODAY);
  });
  if (lateToday.length && !dismissed.has('late')) {
    notifs.push({type:'late', names:lateToday.map(p=>p.name), count:lateToday.length, navPage:'logs'});
  }

  return notifs;
}

function dismissNotif(key) {
  const d = new Set(state.dismissedNotifs || []);
  if (key === 'forgot_out:group') {
    // dismiss all individual forgot_out entries
    state.people.filter(p=>p.role!=='admin').forEach(p=>{
      const log = todayLog(p.id);
      if (log && log.in && !log.out) d.add('forgot_out:'+p.id);
    });
  } else {
    d.add(key);
  }
  setState({ dismissedNotifs: d });
}

function dismissAllNotifs() {
  const notifs = getNotifications();
  const d = new Set(state.dismissedNotifs || []);
  notifs.forEach(n => {
    if (n.type === 'forgot_out') n.people.forEach(p => d.add('forgot_out:'+p.personId));
    else d.add(n.type);
  });
  setState({ dismissedNotifs: d, notifOpen: false });
}

// ─── Check in/out ──────────────────────────────────────────────────────────
async function quickScan(pid, checkinPhoto) {
  const existing = todayLog(pid);
  const time = nowT();

  if (!existing || !existing.in) {
    // State 1: Check in — requires photo
    if (!checkinPhoto) {
      // Open photo capture modal
      setState({ modal: 'checkin_photo', _pendingCheckinPid: pid });
      return;
    }
    const { data, error } = await sb.from('logs').insert({
      person_id: pid, date: TODAY, time_in: time, time_out: '', lunch_out: '', lunch_in: '', checkin_photo: checkinPhoto||''
    }).select().single();
    if (error) { showToast('DB error: ' + error.message); return; }
    const logs = [...state.logs, dbLogToApp(data)];
    setState({ logs, modal: null, _pendingCheckinPid: null });
    showToast(isLate(time, pid, TODAY) ? '⚠ Checked in (late) at '+ft(time) : '✓ Checked in at '+ft(time));

  } else if (existing.in && !existing.lunchOut && !existing.out) {
    // State 2: Go to lunch
    const { error } = await sb.from('logs').update({ lunch_out: time }).eq('id', existing.id);
    if (error) { showToast('DB error: ' + error.message); return; }
    setState({ logs: state.logs.map(l => l.id===existing.id ? {...l, lunchOut:time} : l) });
    showToast('🍽 Lunch break started at '+ft(time));

  } else if (existing.lunchOut && !existing.lunchIn && !existing.out) {
    // State 3: Back from lunch
    const { error } = await sb.from('logs').update({ lunch_in: time }).eq('id', existing.id);
    if (error) { showToast('DB error: ' + error.message); return; }
    setState({ logs: state.logs.map(l => l.id===existing.id ? {...l, lunchIn:time} : l) });
    const lm = lunchDur(existing.lunchOut, time);
    showToast('✓ Back from lunch at '+ft(time)+(lm?' ('+lm+'m break)':''));

  } else if ((existing.lunchIn || (!existing.lunchOut && !existing.lunchIn)) && existing.in && !existing.out) {
    // State 4: Check out
    const { error } = await sb.from('logs').update({ time_out: time }).eq('id', existing.id);
    if (error) { showToast('DB error: ' + error.message); return; }
    setState({ logs: state.logs.map(l => l.id===existing.id ? {...l, out:time} : l) });
    const hrs = ch(existing.in, time, existing.lunchOut, existing.lunchIn);
    showToast(isOvertime(hrs) ? '⚠ Checked out (overtime) at '+ft(time) : '✓ Checked out at '+ft(time));

  } else { showToast('Already completed for today'); }
}
async function adminScan() {

function parseDateLocal(ds) {
  // Parse YYYY-MM-DD as local time (not UTC) to avoid off-by-one day issues
  const [y,m,d] = ds.split('-').map(Number);
  return new Date(y, m-1, d);
}

function schedForDate(ds, personId) {
  return state.schedules.filter(s => {
    const ids = s.personIds || [];
    const matchPerson = ids.includes('all') || (personId === null) || ids.includes(personId);
    if (!matchPerson) return false;
    if (s.repeat === 'none' || !s.repeat) return s.date === ds;
    const base = parseDateLocal(s.date);
    const target = parseDateLocal(ds);
    if (target < base) return false;
    // Cap repeating entries to 1 year from base date
    const maxDate = new Date(base); maxDate.setFullYear(maxDate.getFullYear() + 1);
    if (target > maxDate) return false;
    if (s.repeat === 'weekly') return base.getDay() === target.getDay();
    if (s.repeat === 'daily') { const d = target.getDay(); return d >= 1 && d <= 5; }
    return false;
  });
}

function exportCSV(rows, fname) {
  if (!rows.length) { showToast('Nothing to export'); return; }
  const cols = Object.keys(rows[0]);
  const csv = [cols.join(','),...rows.map(r=>cols.map(c=>JSON.stringify(r[c]??'')).join(','))].join('\n');
  const a = document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=fname; a.click();
  showToast('CSV downloaded');
}
function exportXLSX(rows, sheet, fname) {
  if (typeof XLSX==='undefined') { showToast('Library loading, retry'); return; }
  if (!rows.length) { showToast('Nothing to export'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,sheet);
  XLSX.writeFile(wb,fname); showToast('Excel downloaded');
}
function logRows(logs) {
  return logs.map(l=>{ const p=personOf(l.personId); const hrs=ch(l.in,l.out,l.lunchOut,l.lunchIn); const lm=lunchDur(l.lunchOut,l.lunchIn); return {Name:p.name,Role:p.role,Department:p.dept,Date:l.date,Login:l.in||'','Lunch Out':l.lunchOut||'','Lunch Back':l.lunchIn||'','Lunch (min)':lm||'',Logout:l.out||'','Net Hours':hrs!==null?+hrs.toFixed(2):'',Late:isLate(l.in,l.personId,l.date)?'Yes':'No',Overtime:isOvertime(hrs)?'Yes':'No'}; });
}
function summaryRows() {
  const ff=state.sfFrom, ft2=state.sfTo;
  const fl = state.logs.filter(l=>(!ff||l.date>=ff)&&(!ft2||l.date<=ft2));
  return state.people.filter(p=>p.role!=='admin').map(p=>{
    const pl = fl.filter(l=>l.personId===p.id);
    const tot = pl.reduce((s,l)=>{const h=ch(l.in,l.out,l.lunchOut,l.lunchIn);return s+(h||0);},0);
    const days = pl.filter(l=>ch(l.in,l.out,l.lunchOut,l.lunchIn)!==null).length;
    const late = pl.filter(l=>isLate(l.in,p.id,l.date)).length;
    const ot = pl.filter(l=>isOvertime(ch(l.in,l.out,l.lunchOut,l.lunchIn))).length;
    return {Name:p.name,Role:p.role,Department:p.dept,'Days worked':days,'Total hours':+tot.toFixed(2),'Avg hrs/day':days>0?+(tot/days).toFixed(2):0,'Late arrivals':late,'Overtime days':ot};
  }).sort((a,b)=>b['Total hours']-a['Total hours']);
}

function handlePhotoUpload(inputEl, previewId, dataId) {
  const file = inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    const prev = document.getElementById(previewId);
    if (prev) prev.src = data;
    const dataInput = document.getElementById(dataId);
    if (dataInput) dataInput.value = data;
    // show preview
    const wrap = inputEl.closest('.photo-upload');
    if (wrap) wrap.querySelector('.photo-upload-overlay').style.opacity=0;
  };
  reader.readAsDataURL(file);
}

// ─── Password strength ─────────────────────────────────────────────────────
function pwStrength(pw) {
  let s=0;
  if(pw.length>=6)s++;
  if(pw.length>=10)s++;
  if(/[A-Z]/.test(pw))s++;
  if(/[0-9]/.test(pw))s++;
  if(/[^A-Za-z0-9]/.test(pw))s++;
  return s;
}
function renderPwStrength(id) {
  const val = document.getElementById(id)?.value||'';
  const s = pwStrength(val);
  const colors = ['','#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const labels = ['','Very weak','Weak','Fair','Strong','Very strong'];
  const pct = Math.round((s/5)*100);
  return `<div class="pw-strength"><div class="pw-strength-bar" style="width:${pct}%;background:${colors[s]||'transparent'};"></div></div><div style="font-size:10px;color:${colors[s]||'var(--text-muted)'};margin-top:2px;">${labels[s]||''}</div>`;
}

function getFilteredLogs() {
  return state.logs.filter(l=>{
    const p = personOf(l.personId);
    if(state.filterPerson&&l.personId!==+state.filterPerson) return false;
    if(state.filterRole&&p.role!==state.filterRole) return false;
    if(state.filterFrom&&l.date<state.filterFrom) return false;
    if(state.filterTo&&l.date>state.filterTo) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.in.localeCompare(a.in));
}

function deptRows() {
  const ff=state.sfFrom, ft2=state.sfTo;
  const fl = state.logs.filter(l=>(!ff||l.date>=ff)&&(!ft2||l.date<=ft2));
  const nonAdmin = state.people.filter(p=>p.role!=='admin');
  const depts = [...new Set(nonAdmin.map(p=>p.dept))].sort();
  return depts.map(d=>{
    const members = nonAdmin.filter(p=>p.dept===d);
    const ids = members.map(p=>p.id);
    const dLogs = fl.filter(l=>ids.includes(l.personId));
    const tot = dLogs.reduce((s,l)=>{const h=ch(l.in,l.out,l.lunchOut,l.lunchIn);return s+(h||0);},0);
    const days = dLogs.filter(l=>ch(l.in,l.out,l.lunchOut,l.lunchIn)!==null).length;
    const late = dLogs.filter(l=>isLate(l.in,l.personId,l.date)).length;
    return {dept:d, members:members.length, hours:+tot.toFixed(2), days, late, avg:members.length?+(tot/members.length).toFixed(2):0};
  }).sort((a,b)=>b.hours-a.hours);
}

function renderNotifPanel(notifs) {
  const itemStyle = `display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background .1s;`;
  const bodyStyle = `flex:1;`;
  const dismissBtn = (key) => `<button onclick="event.stopPropagation();dismissNotif('${key}')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:2px 4px;line-height:1;flex-shrink:0;margin-top:-1px;" title="Dismiss">✕</button>`;

  const items = notifs.map(n => {
    if (n.type === 'forgot_out') {
      const sub = n.people.length === 1
        ? `${esc(n.people[0].name)} checked in at ${n.people[0].time} but hasn't logged out.`
        : `${n.people.slice(0,2).map(p=>esc(p.name)).join(', ')}${n.people.length>2?` and ${n.people.length-2} more`:''} forgot to check out.`;
      return `<div style="${itemStyle}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''" onclick="setState({notifOpen:false,navPage:'${n.navPage}'})">
        <div style="${bodyStyle}"><div class="notif-item-title">⚠️ Forgot to check out</div><div class="notif-item-sub">${sub}</div></div>
        ${dismissBtn('forgot_out:group')}
      </div>`;
    }
    if (n.type === 'schedreqs') return `<div style="${itemStyle}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''" onclick="setState({notifOpen:false,navPage:'${n.navPage}'})">
      <div style="${bodyStyle}"><div class="notif-item-title">📅 Schedule requests</div><div class="notif-item-sub">${n.count} staff member${n.count>1?'s':''} sent preferred schedule requests.</div></div>
      ${dismissBtn('schedreqs')}
    </div>`;
    if (n.type === 'leaves') return `<div style="${itemStyle}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''" onclick="setState({notifOpen:false,navPage:'${n.navPage}'})">
      <div style="${bodyStyle}"><div class="notif-item-title">📋 Pending leave requests</div><div class="notif-item-sub">${n.count} leave request${n.count>1?'s':''} need your approval.</div></div>
      ${dismissBtn('leaves')}
    </div>`;
    if (n.type === 'late') return `<div style="${itemStyle}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''" onclick="setState({notifOpen:false,navPage:'${n.navPage}'})">
      <div style="${bodyStyle}"><div class="notif-item-title">🕐 Late arrivals today</div><div class="notif-item-sub">${n.names.slice(0,3).map(esc).join(', ')}${n.count>3?` and ${n.count-3} more`:''} arrived late.</div></div>
      ${dismissBtn('late')}
    </div>`;
    return '';
  }).join('');

  return `<div class="notif-panel" onclick="event.stopPropagation()">
    <div class="notif-header" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Notifications ${notifs.length?`<span class="badge badge-admin" style="margin-left:6px;">${notifs.length}</span>`:''}</span>
      ${notifs.length?`<button onclick="dismissAllNotifs()" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--text-secondary);font-family:inherit;padding:2px 6px;border-radius:4px;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">Clear all</button>`:''}
    </div>
    ${notifs.length===0?'<div class="notif-empty">All clear! No alerts right now.</div>':items}
  </div>`;
}

function renderModal() {

    const log = isEdit ? state.logs.find(l=>l.id===state.editId) : null;
    const personOpts = state.people.filter(p=>p.role!=='admin').map(p=>`<option value="${p.id}" ${log&&log.personId===p.id?'selected':''}>${esc(p.name)} (${p.role})</option>`).join('');
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">

          <input type="file" id="epm-photo-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(this,'epm-photo-preview','epm-photo-data');document.getElementById('epm-photo-preview').style.display='block';if(document.getElementById('epm-photo-placeholder'))document.getElementById('epm-photo-placeholder').style.display='none';">

  if (state.modal==='leave') {

      <div class="form-group"><label class="form-label">Leave type</label>

        <div class="form-group"><label class="form-label">From</label><input type="date" id="lv-from" class="form-input" value="${TODAY}"></div>

      <button class="btn btn-primary btn-full" onclick="saveLeaveModal()">Submit request</button>
    </div></div>`;
  }

  if (state.modal==='shifts') {
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
      <div class="modal-header"><div class="modal-title">Shift settings</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>

      <div class="form-group"><label class="form-label">Shift start time</label><input type="time" id="sh-start" class="form-input" value="${state.shifts.startTime}"></div>
      <div class="form-group"><label class="form-label">Shift end time</label><input type="time" id="sh-end" class="form-input" value="${state.shifts.endTime}"></div>
      <div class="form-group"><label class="form-label">Max hours before overtime</label><input type="number" id="sh-max" class="form-input" value="${state.shifts.maxHours}" min="1" max="24" step="0.5"></div>
      <button class="btn btn-primary btn-full" onclick="saveShifts()">Save settings</button>
    </div></div>`;
  }

  if (state.modal==='sched') {
    const isEditSched = state.editSchedId !== null;
    const se = isEditSched ? state.schedules.find(s=>s.id===state.editSchedId) : null;
    const req = state._prefillReq;
    const nonAdmin = state.people.filter(p=>p.role!=='admin');
    let selIds = [];
    if (se) {
      if (se.personIds) selIds = se.personIds;
    } else if (req) {
      selIds = [req.personId];
    }
    const chips = nonAdmin.map(p=>
      `<div class="chip chip-person ${selIds.includes(p.id)?'selected':''}" id="chip-${p.id}" onclick="toggleSchedChip(${p.id})" title="${esc(p.dept)}">${esc(p.name.split(' ')[0])} <span style="opacity:.6;font-size:10px;">${p.role==='intern'?'(I)':'(E)'}</span></div>`
    ).join('');
    const hint = selIds.length===0?'No one selected yet':selIds.includes('all')?'Assigned to all staff':`${selIds.length} person(s) selected`;
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:500px;">
      <div class="modal-header"><div class="modal-title">${isEditSched?'Edit schedule entry':'Add schedule entry'}</div><button class="btn btn-sm" onclick="closeModal()">&#x2715;</button></div>
      ${req?`<div style="background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--blue);margin-bottom:14px;">📋 From schedule request by <strong>${esc(personOf(req.personId).name)}</strong> — preferred days: ${esc(req.preferredDays)}${req.note?' · '+esc(req.note):''}</div>`:''}
      <div class="form-group"><label class="form-label">Title</label><input id="sc-title" class="form-input" placeholder="e.g. Morning shift, Team meeting" value="${se?esc(se.title):req?'Shift for '+esc(personOf(req.personId).name):''}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Type</label>
          <select id="sc-type" class="form-input">
            <option value="shift" ${!se||se.type==='shift'?'selected':''}>Shift</option>
            <option value="meeting" ${se&&se.type==='meeting'?'selected':''}>Meeting</option>
            <option value="event" ${se&&se.type==='event'?'selected':''}>Event</option>
            <option value="offday" ${se&&se.type==='offday'?'selected':''}>Day off / Holiday</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Location</label>
          <select id="sc-location" class="form-input">
            <option value="office" ${!se||se.location==='office'||!se.location?'selected':''}>🏢 Office</option>
            <option value="field" ${se&&se.location==='field'?'selected':''}>🚗 Field</option>
            <option value="remote" ${se&&se.location==='remote'?'selected':''}>🏠 Remote</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Assigned to <span style="font-weight:400;color:var(--text-muted);">click to select multiple</span></label>
        <div style="margin-bottom:6px;">
          <div class="chip chip-all ${selIds.includes('all')?'selected':''}" id="chip-all" onclick="toggleSchedChip('all')" style="display:inline-flex;">All staff</div>
        </div>
        <div class="chip-picker" id="chip-picker-wrap" style="cursor:default;">${chips}</div>
        <div id="sc-assignee-hint" style="font-size:11px;color:var(--text-muted);margin-top:4px;">${hint}</div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date</label><input type="date" id="sc-date" class="form-input" value="${se?se.date:state.schedPickDate||TODAY}"></div>
        <div class="form-group"><label class="form-label">Repeat</label>
          <select id="sc-repeat" class="form-input">
            <option value="none" ${!se||se.repeat==='none'?'selected':''}>No repeat</option>
            <option value="weekly" ${se&&se.repeat==='weekly'?'selected':''}>Weekly</option>
            <option value="daily" ${se&&se.repeat==='daily'?'selected':''}>Daily (Mon-Fri)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Start time</label><input type="time" id="sc-start" class="form-input" value="${se?se.startTime:req?.preferredStart||state.shifts.startTime}"></div>
        <div class="form-group"><label class="form-label">End time</label><input type="time" id="sc-end" class="form-input" value="${se?se.endTime:req?.preferredEnd||state.shifts.endTime}"></div>
      </div>
      <div class="form-group"><label class="form-label">Note (optional)</label><input id="sc-note" class="form-input" placeholder="Brief note" value="${se?esc(se.note||''):req?esc(req.note||''):''}"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" style="flex:1" onclick="saveSchedModal()">Save</button>
        ${isEditSched?`<button class="btn btn-danger" onclick="deleteSched()">Delete</button>`:''}
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div></div>`;
  }

  if (state.modal==='checkin_photo') {
    return `<div class="modal-overlay"><div class="modal" style="max-width:360px;">
      <div class="modal-header"><div class="modal-title">📸 Check-In Photo</div></div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">Take or upload a photo as proof of attendance. This will be saved with your log.</div>
      <div id="ci-camera-wrap" style="margin-bottom:12px;">
        <video id="ci-video" style="width:100%;border-radius:var(--radius);background:#000;display:none;" autoplay playsinline></video>
        <canvas id="ci-canvas" style="display:none;"></canvas>
        <img id="ci-preview" style="width:100%;border-radius:var(--radius);display:none;" alt="Preview">
        <div id="ci-placeholder" style="height:160px;background:var(--bg);border-radius:var(--radius);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-muted);">
          <span style="font-size:36px;">📷</span>
          <span style="font-size:12px;">Camera or upload photo</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1" onclick="startCamera()">📷 Open Camera</button>
        <button class="btn btn-sm" id="ci-capture-btn" style="display:none;" onclick="capturePhoto()">📸 Capture</button>
        <label class="btn" style="cursor:pointer;">📁 Upload<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleCheckinUpload(this)"></label>
        <button class="btn btn-sm" id="ci-retake-btn" style="display:none;" onclick="retakePhoto()">↺ Retake</button>
      </div>
      <input type="hidden" id="ci-photo-data">
      <div class="modal-footer">
        <button class="btn btn-success" style="flex:1" onclick="submitCheckinPhoto()" id="ci-submit-btn">✓ Check In</button>
        <button class="btn" onclick="closeCheckinModal()">Cancel</button>
      </div>
    </div></div>`;
  }

  if (state.modal==='team') {
    const t = state.editTeamId ? state.teams.find(x=>x.id===state.editTeamId) : null;
    const nonAdmin = state.people.filter(p=>p.role!=='admin');
    const selIds = t ? t.memberIds : [];
    const chips = nonAdmin.map(p=>
      `<div class="chip tm-chip-person ${selIds.includes(p.id)?'selected':''}" id="tm-chip-${p.id}" onclick="toggleTeamChip(${p.id})" title="${esc(p.dept)}">${esc(p.name.split(' ')[0])} <span style="opacity:.6;font-size:10px;">${p.role==='intern'?'(I)':'(E)'}</span></div>`
    ).join('');
    const colors = ['#2563eb','#16a34a','#dc2626','#d97706','#7c3aed','#0891b2','#be185d'];
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
      <div class="modal-header"><div class="modal-title">${t?'Edit team':'Create team'}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="form-group"><label class="form-label">Team name</label><input id="tm-name" class="form-input" placeholder="e.g. Frontend, Design" value="${t?esc(t.name):''}"></div>
      <div class="form-group"><label class="form-label">Color</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
          ${colors.map(c=>`<div onclick="document.getElementById('tm-color').value='${c}';document.querySelectorAll('.color-swatch').forEach(x=>x.style.outline='none');this.style.outline='3px solid '+this.style.background+';outline-offset:2px'" class="color-swatch" style="width:24px;height:24px;border-radius:50%;background:${c};cursor:pointer;${t&&t.color===c?'outline:3px solid '+c+';outline-offset:2px':''}"></div>`).join('')}
        </div>
        <input type="hidden" id="tm-color" value="${t?t.color:colors[0]}">
      </div>
      <div class="form-group">
        <label class="form-label">Members <span style="font-weight:400;color:var(--text-muted);">click to select</span></label>
        <div class="chip-picker" style="cursor:default;">${chips}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" style="flex:1" onclick="saveTeamModal()">${t?'Save changes':'Create team'}</button>
        ${t?`<button class="btn btn-danger" onclick="deleteTeam(${t.id})">Delete</button>`:''}
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div></div>`;
  }

  if (state.modal==='tripping') {
    const t = state.editTrippingId ? state.trippings.find(x=>x.id===state.editTrippingId) : null;
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:440px;">
      <div class="modal-header"><div class="modal-title">🚗 ${t?'Edit Trip':'Create Trip'}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="form-group"><label class="form-label">Trip title</label><input id="tr-title" class="form-input" placeholder="e.g. Client Visit – Makati" value="${t?esc(t.title):''}"></div>
      <div class="form-group"><label class="form-label">Destination</label><input id="tr-dest" class="form-input" placeholder="e.g. Makati City Hall" value="${t?esc(t.destination):''}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date</label><input type="date" id="tr-date" class="form-input" value="${t?t.date:''}"></div>
        <div class="form-group"><label class="form-label">Time</label><input type="time" id="tr-time" class="form-input" value="${t?t.time:''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Car / Vehicle type</label><input id="tr-car" class="form-input" placeholder="e.g. Van, SUV, Sedan" value="${t?esc(t.carType):''}"></div>
        <div class="form-group"><label class="form-label">Total seats</label><input type="number" id="tr-seats" class="form-input" min="1" max="50" placeholder="e.g. 7" value="${t?t.seats:''}"></div>
      </div>
      <div class="form-group"><label class="form-label">Status</label>
        <select id="tr-status" class="form-input">
          <option value="open" ${!t||t.status==='open'?'selected':''}>Open</option>
          <option value="full" ${t&&t.status==='full'?'selected':''}>Full</option>
          <option value="closed" ${t&&t.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Notes (optional)</label><textarea id="tr-note" class="form-input" rows="2" style="resize:vertical;" placeholder="Details, meeting notes, reminders…">${t?esc(t.note):''}</textarea></div>
      <div class="modal-footer">
        <button class="btn btn-primary" style="flex:1" onclick="saveTrippingModal()">${t?'Save changes':'Create trip'}</button>
        ${t?`<button class="btn btn-danger" onclick="deleteTripping(${t.id})">Delete</button>`:''}
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div></div>`;
  }

  if (state.modal==='apply_tripping') {
    const trip = state.trippings.find(t=>t.id===state._applyTrippingId);
    const clients = state._applyClients||[''];
    const filled = trip ? trip.applicants.reduce((s,a)=>s+1+(a.clients||[]).length,0) : 0;
    const remaining = trip ? trip.seats - filled : 0;
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:400px;">
      <div class="modal-header"><div class="modal-title">🚗 Apply for Trip</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      ${trip?`<div style="background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--blue);margin-bottom:14px;">
        <strong>${esc(trip.title)}</strong><br>
        <span style="font-size:12px;">📍 ${esc(trip.destination||'—')} &nbsp;·&nbsp; ${remaining} seat${remaining!==1?'s':''} available</span>
      </div>`:''}
      <div class="form-group">
        <label class="form-label">Your name</label>
        <input class="form-input" value="${esc(state.user?.name||'')}" disabled style="opacity:.7;">
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">1 seat will be reserved for you</div>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <label class="form-label" style="margin:0;">Clients bringing along <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>
          <button class="btn btn-sm" onclick="addTripClientField()" ${clients.length>=remaining-1?'disabled':''}>+ Add</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Each client takes 1 seat. Leave blank to bring none.</div>
        ${clients.map((c,i)=>`
          <div style="display:flex;gap:6px;margin-bottom:6px;">
            <input class="form-input trip-client-input" placeholder="Client name" value="${esc(c)}" style="flex:1;">
            ${clients.length>1?`<button class="btn btn-danger btn-sm" onclick="removeTripClientField(${i})">✕</button>`:''}
          </div>`).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" style="flex:1" onclick="saveApplyTripping()">✓ Confirm Application</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div></div>`;
  }

  if (state.modal==='schedrequest') {
    const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const dayRows = days.map((d,i) => `
      <div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;background:var(--bg);">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <input type="checkbox" id="sr-day-${i}" style="width:15px;height:15px;cursor:pointer;" onchange="document.getElementById('sr-day-row-${i}').style.opacity=this.checked?'1':'0.45'">
          <label for="sr-day-${i}" style="font-size:13px;font-weight:600;cursor:pointer;flex:1;">${d}</label>
        </div>
        <div id="sr-day-row-${i}" style="opacity:0.45;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <select id="sr-loc-${i}" class="form-input" style="width:110px;">
            <option value="office">🏢 Office</option>
            <option value="field">🚗 Field</option>
            <option value="remote">🏠 Remote</option>
          </select>
          <input type="time" id="sr-from-${i}" class="form-input" style="width:110px;" value="${state.shifts.startTime}">
          <span style="font-size:12px;color:var(--text-secondary);">to</span>
          <input type="time" id="sr-to-${i}" class="form-input" style="width:110px;" value="${state.shifts.endTime}">
        </div>
      </div>`).join('');
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px;max-height:90vh;overflow-y:auto;">
      <div class="modal-header"><div class="modal-title">📅 Request Preferred Schedule</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">Check the days you can work and set your preferred location and hours. Admin will see this when planning your schedule.</div>
      ${dayRows}
      <div class="form-group" style="margin-top:10px;"><label class="form-label">Additional notes (optional)</label><textarea id="sr-note" class="form-input" rows="2" placeholder="Any other notes for your admin…" style="resize:vertical;"></textarea></div>
      <button class="btn btn-primary btn-full" onclick="saveScheduleRequest()">Send to admin</button>
    </div></div>`;
  }


  if (state.modal==='schedreqpreview') {
    const reqId = state._previewReqId;
    const req = state.scheduleRequests.find(r=>r.id===reqId);
    if (!req) return '';
    const p = personOf(req.personId);
    const entries = parseSchedReqDays(req.preferredDays);
    const locIcon = loc => loc==='field'?'🚗':loc==='remote'?'🏠':'🏢';
    const locLabel = loc => loc==='field'?'Field':loc==='remote'?'Remote':'Office';
    const entryRows = entries.length
      ? entries.map(e=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--bg);">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;"></div>
            <div style="flex:1;">
              <span style="font-weight:600;font-size:13px;">${e.day}</span>
              <span style="color:var(--text-secondary);font-size:12px;margin-left:8px;">${locIcon(e.location)} ${locLabel(e.location)}</span>
              ${e.startTime?`<span style="color:var(--text-secondary);font-size:12px;margin-left:6px;">· ${e.startTime}–${e.endTime}</span>`:''}
            </div>
          </div>`).join('')
      : `<div class="empty-state">Could not parse days from this request. Try editing manually.</div>`;
    return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:440px;">

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        ${avatarHTML(p,'av-xs')}
        <div><div style="font-weight:600;">${esc(p.name)}</div><div style="font-size:12px;color:var(--text-secondary);">${req.note||'No notes'}</div></div>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">
        ${entries.length} day${entries.length!==1?'s':''} will be added as one-time shifts for next week

function adminDashboard() {
  const nonAdmin = state.people.filter(p=>p.role!=='admin');

  const checkedOut = nonAdmin.filter(p=>todayLogs.some(l=>l.personId===p.id&&l.out));
  const lateToday = nonAdmin.filter(p=>{ const log=todayLog(p.id); return log&&isLate(log.in,p.id,TODAY); });
  const totalHToday = todayLogs.reduce((s,l)=>{const h=ch(l.in,l.out,l.lunchOut,l.lunchIn);return s+(h||0);},0);
  const pendingLeaves = state.leaves.filter(l=>l.status==='pending').length;

  return `

    <tbody>${nonAdmin.map(p=>{
      const log = todayLog(p.id);
      const inn = log?.in||''; const out = log?.out||'';
      const lunchOut = log?.lunchOut||''; const lunchIn = log?.lunchIn||'';
      const hrs = ch(inn,out,lunchOut,lunchIn);
      const onLunch = !!(inn && lunchOut && !lunchIn && !out);
      const status = inn?(out?'out':onLunch?'lunch':'in'):'absent';

      return `<tr>
        <td><div class="tbl-person">${avatarHTML(p,'av-xs')}<span>${esc(p.name)}</span></div></td>

        <td class="text-danger">${ft(out)}</td>
        <td>${hrs!==null?`<span class="hpill hpill-done">${fh(hrs)}</span>`:inn?`<span class="hpill hpill-active">Active</span>`:'—'}</td>
        <td>${late?`<span class="badge badge-late">Late</span>`:''} ${ot?`<span class="badge badge-overtime">OT</span>`:''}</td>
      </tr>`;
    }).join('')}</tbody></table>

  </div>`;
}

function adminScanPage() {

  const lm = lunchDur(lunchOut, lunchIn);

  let action='', btnLabel='', btnClass='', statusMsg='', icon='';

function adminDeptReport() {
  const ff=state.sfFrom, ft2=state.sfTo;
  const fl = state.logs.filter(l=>(!ff||l.date>=ff)&&(!ft2||l.date<=ft2));
  const nonAdmin = state.people.filter(p=>p.role!=='admin');
  const depts = [...new Set(nonAdmin.map(p=>p.dept))].sort();
  const maxH = Math.max(1,...depts.map(d=>{
    const ids = nonAdmin.filter(p=>p.dept===d).map(p=>p.id);
    return fl.filter(l=>ids.includes(l.personId)).reduce((s,l)=>{const h=ch(l.in,l.out,l.lunchOut,l.lunchIn);return s+(h||0);},0);
  }));
  const deptData = depts.map(d=>{
    const members = nonAdmin.filter(p=>p.dept===d);
    const ids = members.map(p=>p.id);
    const dLogs = fl.filter(l=>ids.includes(l.personId));
    const tot = dLogs.reduce((s,l)=>{const h=ch(l.in,l.out,l.lunchOut,l.lunchIn);return s+(h||0);},0);
    const days = dLogs.filter(l=>ch(l.in,l.out,l.lunchOut,l.lunchIn)!==null).length;
    const late = dLogs.filter(l=>isLate(l.in,l.personId,l.date)).length;
    return {dept:d, members:members.length, hours:tot, days, late, avg: members.length?tot/members.length:0};
  }).sort((a,b)=>b.hours-a.hours);

  return `<div class="card">
    <div class="card-header"><div class="card-title">Department report</div>
      <div class="btn-group">
        <button class="btn btn-sm" onclick="exportDeptCSV()">CSV</button>

function toLocalDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getWeekDates(offsetWeeks) {
  const now = new Date();
  const dow = now.getDay(); // 0=Sun
  const monday = new Date(now); monday.setDate(now.getDate() - dow + (dow===0?-6:1));
  monday.setDate(monday.getDate() + offsetWeeks*7);
  const dates = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    dates.push(toLocalDateStr(d));
  }
  return dates;
}

  // Attach swipe-to-close on nav drawer
  requestAnimationFrame(() => {
    const drawer = document.getElementById('nav-drawer');
    const handle = document.getElementById('nav-drawer-handle');
    if (!drawer) return;
    let startY = 0, currentY = 0, dragging = false;
    const onTouchStart = e => { startY = e.touches[0].clientY; dragging = true; drawer.style.transition = 'none'; };
    const onTouchMove = e => {
      if (!dragging) return;
      currentY = e.touches[0].clientY;
      const dy = Math.max(0, currentY - startY);
      drawer.style.transform = `translateY(${dy}px)`;
    };
    const onTouchEnd = () => {
      dragging = false;
      drawer.style.transition = '';
      drawer.style.transform = '';
      if (currentY - startY > 80) setState({moreOpen: false});
    };
    drawer.addEventListener('touchstart', onTouchStart, {passive:true});
    drawer.addEventListener('touchmove', onTouchMove, {passive:true});
    drawer.addEventListener('touchend', onTouchEnd);
  });
}

let _cameraStream = null;
function startCamera() {
  const video = document.getElementById('ci-video');
  const placeholder = document.getElementById('ci-placeholder');
  const captureBtn = document.getElementById('ci-capture-btn');
  if (!video) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      _cameraStream = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      captureBtn.style.display = 'inline-flex';
    })
    .catch(() => showToast('Camera not available — please upload a photo instead'));
}
function capturePhoto() {
  const video = document.getElementById('ci-video');
  const canvas = document.getElementById('ci-canvas');
  const preview = document.getElementById('ci-preview');
  const captureBtn = document.getElementById('ci-capture-btn');
  const retakeBtn = document.getElementById('ci-retake-btn');
  if (!video || !canvas) return;
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const data = canvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('ci-photo-data').value = data;
  preview.src = data; preview.style.display = 'block';
  video.style.display = 'none'; captureBtn.style.display = 'none';
  retakeBtn.style.display = 'inline-flex';
  if (_cameraStream) { _cameraStream.getTracks().forEach(t=>t.stop()); _cameraStream = null; }
}
function retakePhoto() {
  const preview = document.getElementById('ci-preview');
  const retakeBtn = document.getElementById('ci-retake-btn');
  document.getElementById('ci-photo-data').value = '';
  preview.style.display = 'none'; retakeBtn.style.display = 'none';
  document.getElementById('ci-placeholder').style.display = 'flex';
}
function handleCheckinUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    document.getElementById('ci-photo-data').value = data;
    const preview = document.getElementById('ci-preview');
    preview.src = data; preview.style.display = 'block';
    document.getElementById('ci-placeholder').style.display = 'none';
    const retakeBtn = document.getElementById('ci-retake-btn');
    if (retakeBtn) retakeBtn.style.display = 'inline-flex';
  };
  reader.readAsDataURL(file);
}
async function submitCheckinPhoto() {

// Parse "Monday (🏢 Office 09:00–18:00), Wednesday (🚗 Field 08:00–17:00)" into structured entries
function parseSchedReqDays(preferredDays) {
  const dayMap = {monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sunday:0};
  const entries = [];
  // Split by day name boundaries
  const parts = preferredDays.split(/,\s*(?=Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/i);
  for (const part of parts) {
    const m = part.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*\(([^)]*)\)/i);
    if (!m) continue;
    const dayName = m[1].toLowerCase();
    const detail = m[2];
    const locMatch = detail.match(/(office|field|remote)/i);
    const timeMatch = detail.match(/(\d{1,2}:\d{2})[–\-](\d{1,2}:\d{2})/);
    entries.push({
      day: m[1],
      dayNum: dayMap[dayName],
      location: locMatch ? locMatch[1].toLowerCase() : 'office',
      startTime: timeMatch ? timeMatch[1] : '',
      endTime: timeMatch ? timeMatch[2] : '',
    });
  }
  return entries;
}

// Get the next occurrence of a weekday (0=Sun…6=Sat) on or after a base date
function nextWeekday(dayNum, baseDate) {
  const d = new Date(baseDate);
  const diff = (dayNum - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return toLocalDateStr(d);
}

async function addAllSchedFromReq(reqId) {
  const req = state.scheduleRequests.find(r=>r.id===reqId);
  if (!req) return;
  const entries = parseSchedReqDays(req.preferredDays);
  if (!entries.length) { showToast('Could not parse any days from this request'); return; }

  const p = state.people.find(x=>x.id===req.personId);
  const personName = p ? p.name.split(' ')[0] : 'Staff';
  const baseDate = new Date();
  // Find Monday of the coming week to anchor the schedule
  const daysUntilMonday = (8 - baseDate.getDay()) % 7 || 7;
  const weekStart = new Date(baseDate);
  weekStart.setDate(baseDate.getDate() + daysUntilMonday);

  const insertPayloads = entries.map(e => {
    const date = nextWeekday(e.dayNum, weekStart);
    const locLabel = e.location==='field'?'Field':e.location==='remote'?'Remote':'Office';
    return {
      title: `${personName} – ${locLabel} Shift`,
      type: 'shift',
      location: e.location,
      person_ids: JSON.stringify([req.personId]),
      date,
      repeat: 'none',
      start_time: e.startTime,
      end_time: e.endTime,
      note: req.note||''
    };
  });

  let addedCount = 0;
  const newScheds = [...state.schedules];
  for (const payload of insertPayloads) {
    const { data, error } = await sb.from('schedules').insert(payload).select().single();
    if (error) { showToast('DB error: ' + error.message); continue; }
    newScheds.push(dbSchedToApp(data));
    addedCount++;
  }

  // Mark request as reviewed
  await sb.from('schedule_requests').update({status:'reviewed'}).eq('id', reqId);
  const updatedReqs = state.scheduleRequests.map(r=>r.id===reqId?{...r,status:'reviewed'}:r);

  setState({schedules: newScheds, scheduleRequests: updatedReqs, modal: null, _previewReqId: null});
  showToast(`Added ${addedCount} schedule entr${addedCount===1?'y':'ies'} (weekly, starting next week)`);
}

            <div style="font-size:12px;color:var(--text-secondary);">🚗 ${esc(t.carType||'—')} &nbsp;·&nbsp; ${remaining>0?`<span style="color:var(--green);font-weight:500;">${remaining} seat${remaining!==1?'s':''} left</span>`:'<span style="color:var(--red);font-weight:500;">No seats left</span>'}</div>

function openApplyTripping(tripId) {
  setState({ modal: 'apply_tripping', _applyTrippingId: tripId, _applyClients: [''] });
}

async function saveApplyTripping() {
  const u = state.user;
  const tripId = state._applyTrippingId;
  const trip = state.trippings.find(t=>t.id===tripId);
  if (!trip) return;
  const clientInputs = document.querySelectorAll('.trip-client-input');
  const clients = Array.from(clientInputs).map(i=>i.value.trim()).filter(Boolean);
  const filled = trip.applicants.reduce((s,a)=>s+1+(a.clients||[]).length, 0);
  const wouldTake = 1 + clients.length;
  if (filled + wouldTake > trip.seats) { showToast(`Only ${trip.seats - filled} seat(s) left`); return; }
  const newApplicant = { personId: u.id, personName: u.name, clients };
  const newApplicants = [...trip.applicants, newApplicant];
  const newFilled = newApplicants.reduce((s,a)=>s+1+(a.clients||[]).length,0);
  const newStatus = newFilled >= trip.seats ? 'full' : 'open';
  const { error } = await sb.from('trippings').update({ applicants: JSON.stringify(newApplicants), status: newStatus }).eq('id', tripId);
  if (error) { showToast('DB error: '+error.message); return; }
  setState({ trippings: state.trippings.map(t=>t.id===tripId?{...t,applicants:newApplicants,status:newStatus}:t), modal:null, _applyTrippingId:null, _applyClients:null });
  showToast('Applied successfully!');
}

async function cancelTrippingApplication(tripId) {
  const u = state.user;
  const trip = state.trippings.find(t=>t.id===tripId);
  if (!trip) return;
  const newApplicants = trip.applicants.filter(a=>a.personId!==u.id);
  const filled = newApplicants.reduce((s,a)=>s+1+(a.clients||[]).length,0);
  const newStatus = filled >= trip.seats ? 'full' : 'open';
  const { error } = await sb.from('trippings').update({ applicants: JSON.stringify(newApplicants), status: newStatus }).eq('id', tripId);
  if (error) { showToast('DB error: '+error.message); return; }
  setState({ trippings: state.trippings.map(t=>t.id===tripId?{...t,applicants:newApplicants,status:newStatus}:t) });
  showToast('Application cancelled');
}

async function removeTrippingApplicant(tripId, idx) {
  const trip = state.trippings.find(t=>t.id===tripId);
  if (!trip) return;
  const newApplicants = trip.applicants.filter((_,i)=>i!==idx);
  const filled = newApplicants.reduce((s,a)=>s+1+(a.clients||[]).length,0);
  const newStatus = filled >= trip.seats ? 'full' : 'open';
  const { error } = await sb.from('trippings').update({ applicants: JSON.stringify(newApplicants), status: newStatus }).eq('id', tripId);
  if (error) { showToast('DB error: '+error.message); return; }
  setState({ trippings: state.trippings.map(t=>t.id===tripId?{...t,applicants:newApplicants,status:newStatus}:t) });
  showToast('Removed');
}

async function saveTrippingModal() {
  const title = document.getElementById('tr-title')?.value.trim();
  const destination = document.getElementById('tr-dest')?.value.trim();
  const date = document.getElementById('tr-date')?.value;
  const time = document.getElementById('tr-time')?.value;
  const carType = document.getElementById('tr-car')?.value.trim();
  const seats = parseInt(document.getElementById('tr-seats')?.value)||0;
  const note = document.getElementById('tr-note')?.value.trim();
  const status = document.getElementById('tr-status')?.value||'open';
  if (!title) { showToast('Title required'); return; }
  if (!seats || seats < 1) { showToast('Seats must be at least 1'); return; }
  const payload = { title, destination, date, time, car_type: carType, seats, note, status };
  if (state.editTrippingId) {
    const trip = state.trippings.find(t=>t.id===state.editTrippingId);
    const { error } = await sb.from('trippings').update(payload).eq('id', state.editTrippingId);
    if (error) { showToast('DB error: '+error.message); return; }
    setState({ trippings: state.trippings.map(t=>t.id===state.editTrippingId?{...t,...payload,carType,applicants:trip.applicants}:t), modal:null, editTrippingId:null });
    showToast('Trip updated');
  } else {
    const insertPayload = { ...payload, applicants: JSON.stringify([]) };
    const { data, error } = await sb.from('trippings').insert(insertPayload).select().single();
    if (error) { showToast('DB error: '+error.message); return; }
    setState({ trippings: [...state.trippings, dbTrippingToApp(data)], modal:null });
    showToast('Trip created');
  }
}

async function deleteTripping(id) {
  if (!confirm('Delete this trip?')) return;
  const { error } = await sb.from('trippings').delete().eq('id', id);
  if (error) { showToast('DB error: '+error.message); return; }
  setState({ trippings: state.trippings.filter(t=>t.id!==id), modal:null, editTrippingId:null });
  showToast('Trip deleted');
}

function addTripClientField() {
  setState({ _applyClients: [...(state._applyClients||['']), ''] });
}
function removeTripClientField(i) {
  const arr = [...(state._applyClients||[])];
  arr.splice(i, 1);
  setState({ _applyClients: arr.length ? arr : [''] });
